# Render Blueprint (free plan). Render: New > Blueprint, pick this repo.
# Free instances have no persistent disk, so data lives in a free Turso database.
# Render asks for TURSO_DATABASE_URL and TURSO_AUTH_TOKEN when you apply the blueprint.
services:
  - type: web
    name: design-dimensions-studio
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: TURSO_DATABASE_URL     # e.g. libsql://design-dimensions-<you>.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Demo people and sample work for trying the app. Set to "false" before adding real
      # clients: demo accounts then stop working and the login page stops listing them.
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        value: demo-studio-2026
      # Optional: Google API key for the Drive link-sharing check.
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
